{% extends 'base.html' %}

{% block title %}Excluir tarefa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h1 class="h5">Excluir esta tarefa?</h1>
                <p class="text-muted">"{{ tarefa.titulo }}" será removida definitivamente.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sim, excluir</button>
                    <a href="{% url 'listar_tarefas' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
